spring:
  application:
    name: config-server

  profiles:
    active: native

  cloud:
    config:
      server:
        health:
          enabled: true
        native:
          search-locations: classpath:/config-repo

server:
  address: 0.0.0.0
  port: 8888


management:
  endpoints:
    web:
      exposure:
        include: health,info

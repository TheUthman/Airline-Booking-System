spring:
  application:
    name: config-server

  profiles:
    active: native

  cloud:
    config:
      server:
        health:
          enabled: false
        native:
          # All centrally served configuration ships in this application JAR.
          # Add shared configuration here rather than using an external Git repo.
          search-locations: classpath:/config-repo

server:
  port: 8888

management:
  endpoints:
    web:
      exposure:
        include: health,info

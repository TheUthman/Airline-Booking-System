spring:
  application: { name: admin-service }
  config: { import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}" }
  datasource: { url: "${ADMIN_DB_URL:jdbc:h2:file:./data/admin-db;MODE=PostgreSQL;AUTO_SERVER=TRUE}", username: "${ADMIN_DB_USERNAME:sa}", password: "${ADMIN_DB_PASSWORD:}" }
  jpa: { hibernate: { ddl-auto: update }, open-in-view: false }
server: { port: 8088 }
eureka: { client: { service-url: { defaultZone: "${EUREKA_URL:http://localhost:8761/eureka/}" } } }

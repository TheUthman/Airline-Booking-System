<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8" /></head>
<body>
    <div th:fragment="email-footer"
         style="background-color: #f3eee6; padding: 24px 24px 20px 24px;
                border-radius: 0 0 12px 12px; border-top: 1px solid #e6e0d6; text-align: center;
                font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">

        <!-- Brand Wordmark & Tagline -->
        <p style="margin: 0 0 6px 0; font-size: 14px; font-weight: 800; letter-spacing: -0.3px;">
            <span style="color: #e87516;">Tiger</span><span style="color: #ffb52e;">Airlines</span>
        </p>
        <p style="margin: 0 0 14px 0; font-size: 12px; color: #6b7280; line-height: 1.5;">
            West Africa’s premier aviation network &bull; Lagos &bull; Abuja &bull; Port Harcourt
        </p>

        <!-- Divider Line -->
        <div style="width: 36px; height: 2px; background-color: #e87516; margin: 0 auto 14px auto; border-radius: 1px;"></div>

        <!-- Support Info -->
        <p style="margin: 0 0 6px 0; font-size: 12px; color: #4b5563; line-height: 1.6;">
            Need assistance? Our support team is here to help &mdash;
            <a href="mailto:support@tigerairlines.com"
               style="color: #e87516; text-decoration: none; font-weight: 600;">support@tigerairlines.com</a>
        </p>
        <p style="margin: 0 0 10px 0; font-size: 11px; color: #9ca3af;">
            You received this email regarding your TigerAirlines account or booking reservation.
        </p>
        <p style="margin: 0; font-size: 11px; color: #9ca3af;">
            &copy; 2026 TigerAirlines. All rights reserved.
        </p>
    </div>
</body>
</html>

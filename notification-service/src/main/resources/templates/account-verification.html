<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Verify Your Account</title>
</head>
<body style="margin: 0; padding: 20px; background-color: #f1f5f9; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;">
    <table align="center" border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px; background: #ffffff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow: hidden;">
        <tr>
            <td>
                <div th:replace="~{fragments/header :: email-header('Welcome to SkyWings Airlines')}"></div>
            </td>
        </tr>
        <tr>
            <td style="padding: 28px 24px; color: #1e293b;">
                <p style="margin: 0 0 16px 0; font-size: 15px; color: #334155;">
                    Welcome <span th:text="${userName != null ? userName : 'aboard'}">aboard</span>! ✈️
                </p>
                <p style="margin: 0 0 20px 0; line-height: 1.5; color: #475569;">
                    Thanks for creating an account with SkyWings. Please verify your email address to activate your account and start managing your flight bookings:
                </p>

                <div style="text-align: center; margin: 30px 0;">
                    <a th:href="${verificationUrl}" href="#" style="background-color: #16a34a; color: #ffffff; text-decoration: none; padding: 14px 28px; border-radius: 6px; font-weight: 700; font-size: 15px; display: inline-block;">
                        Verify Email Address
                    </a>
                </div>

                <div style="border-top: 1px solid #e2e8f0; padding-top: 16px; margin-top: 20px;">
                    <p style="margin: 0; font-size: 11px; color: #94a3b8; word-break: break-all;">
                        Button not working? Copy and paste this link into your browser:<br />
                        <span th:text="${verificationUrl}">https://airline.com/verify-email?token=xyz</span>
                    </p>
                </div>
            </td>
        </tr>
        <tr>
            <td>
                <div th:replace="~{fragments/footer :: email-footer}"></div>
            </td>
        </tr>
    </table>
</body>
</html>

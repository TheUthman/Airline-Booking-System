spring:
  application: { name: notification-service }
  config: { import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}" }
  datasource: { url: "${NOTIFICATION_DB_URL:jdbc:h2:file:./data/notification-db;MODE=PostgreSQL;AUTO_SERVER=TRUE}", username: "${NOTIFICATION_DB_USERNAME:sa}", password: "${NOTIFICATION_DB_PASSWORD:}" }
  jpa: { hibernate: { ddl-auto: update }, open-in-view: false }
  rabbitmq: { host: "${RABBITMQ_HOST:localhost}", port: "${RABBITMQ_PORT:5672}" }
server: { port: 8087 }
notifications:
  email:
    resend-api-key: "${RESEND_API_KEY:}"
    from: "${EMAIL_FROM:Airline Booking <onboarding@resend.dev>}"
eureka: { client: { service-url: { defaultZone: "${EUREKA_URL:http://localhost:8761/eureka/}" } } }

spring:
  application:
    name: api-gateway

  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/auth/**
            - id: flight-service
              uri: lb://FLIGHT-SERVICE
              predicates:
                - Path=/api/flights/**
              filters:
                - name: CircuitBreaker
                  args:
                    id: flightServiceCircuitBreaker
                    fallbackUri: forward:/fallback/flight-service

            - id: pricing-service
              uri: lb://PRICING-SERVICE
              predicates:
                - Path=/api/pricing/**
            - id: passenger-service
              uri: lb://PASSENGER-SERVICE
              predicates:
                - Path=/api/passengers/**
            - id: booking-service
              uri: lb://BOOKING-SERVICE
              predicates:
                - Path=/api/bookings/**
            - id: payment-service
              uri: lb://PAYMENT-SERVICE
              predicates:
                - Path=/api/payments/**

            - id: notification-service
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/api/notifications/**

            - id: admin-service
              uri: lb://ADMIN-SERVICE
              predicates:
                - Path=/api/admin/**


server:
  port: ${PORT:8080}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

jwt:
  secret: ${JWT_SECRET}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

rate-limit:
  requests-per-minute: ${GATEWAY_REQUESTS_PER_MINUTE:120}

resilience4j:
  circuitbreaker:
    instances:

      flightServiceCircuitBreaker:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info

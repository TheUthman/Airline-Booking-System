spring:
  application: { name: passenger-service }
  config: { import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}" }
  datasource: { url: "${PASSENGER_DB_URL:jdbc:h2:file:./data/passenger-db;MODE=PostgreSQL;AUTO_SERVER=TRUE}", username: "${PASSENGER_DB_USERNAME:sa}", password: "${PASSENGER_DB_PASSWORD:}" }
  jpa: { hibernate: { ddl-auto: update }, open-in-view: false }
server: { port: 8084 }
eureka: { client: { service-url: { defaultZone: "${EUREKA_URL:http://localhost:8761/eureka/}" } } }
management: { endpoints: { web: { exposure: { include: health,info } } } }
